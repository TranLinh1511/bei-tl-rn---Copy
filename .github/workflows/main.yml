name: Build IPA for TrollStore (no Apple Developer account)

# Cách dùng:
# 1. Đưa toàn bộ nội dung thư mục "bei-tl-rn - Copy" lên 1 GitHub repo (ở gốc repo, không để trong subfolder).
# 2. Copy file này vào .github/workflows/build-ipa-trollstore.yml trong repo đó.
# 3. Push code lên GitHub -> vào tab Actions -> chạy workflow "Build IPA for TrollStore".
# 4. Sau khi chạy xong, vào Actions -> chọn run -> mục Artifacts -> tải file "app-ipa" về.
# 5. Chuyển file .ipa vào iPhone (AirDrop / Files / cáp) -> mở bằng TrollStore để cài.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Expo prebuild (generate native ios project)
        run: npx expo prebuild -p ios --clean

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build .app (no code signing)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          echo "Using workspace=$WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" -list
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed -e 's/^[ \t]*//' | head -n 1)
          echo "Using scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Install ldid (fakesign tool)
        run: brew install ldid

      - name: Package + fakesign IPA
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH" .app)
          # Fakesign the main binary and any embedded frameworks
          find "Payload/$APP_NAME.app" -type f \( -perm -u+x \) -exec ldid -S {} \; 2>/dev/null || true
          ldid -S "Payload/$APP_NAME.app/$APP_NAME"
          zip -r -y "$APP_NAME.ipa" Payload
          mkdir -p ../out
          mv "$APP_NAME.ipa" ../out/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: out/*.ipa
